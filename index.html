<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нотатник</title>
<style>

:root{
  --paper:#f3f4f6; --white:#ffffff; --ink:#15171c; --ink-2:#3a3f4a; --muted:#7a808c;
  --line:#e2e4e9; --line-2:#eceef1; --focus:#2f54eb;
  --c-title:#2f54eb; --c-desc:#1f9d63; --c-tags:#f08a00; --c-text:#d6453d;
  --c-title-bg:#e9eeff; --c-desc-bg:#e4f5ec; --c-tags-bg:#fff0d9; --c-text-bg:#fbe8e6;
  --danger:#d6453d;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:transparent;margin:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}

.app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%}

/* ---------- Rail ---------- */
.rail{background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-top{padding:22px 20px 14px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.cube{display:grid;grid-template-columns:repeat(3,7px);grid-template-rows:repeat(3,7px);gap:2px}
.cube i{border-radius:1.5px;background:var(--line)}
.cube i:nth-child(1){background:var(--c-title)}
.cube i:nth-child(2){background:var(--c-desc)}
.cube i:nth-child(3){background:var(--c-tags)}
.cube i:nth-child(5){background:var(--ink)}
.cube i:nth-child(7){background:var(--c-text)}
.cube i:nth-child(9){background:var(--c-title)}
.logo b{font-size:20px;font-weight:700;letter-spacing:-.03em}
.btn-new{width:100%;height:42px;border-radius:9px;background:var(--ink);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-new:hover{background:#000}
.btn-new svg,.ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.find{margin-top:10px;height:38px;border-radius:9px;background:var(--paper);padding:0 12px;display:flex;align-items:center;gap:8px}
.find svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;flex:none}
.find input{width:100%;font-size:14px}
.find input::placeholder{color:var(--muted)}

.notes{flex:1;overflow-y:auto;min-height:0;border-top:1px solid var(--line-2)}
.row{display:block;width:100%;text-align:left;padding:13px 20px 13px 17px;border-bottom:1px solid var(--line-2);border-left:3px solid transparent;position:relative}
.row:hover{background:#f8f9fb}
.row.on{background:var(--paper);border-left-color:var(--ink)}
.row .t{font-weight:600;font-size:14.5px;line-height:1.35;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.row .t.none{color:var(--muted);font-weight:500}
.row .m{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.none-yet{padding:36px 20px;color:var(--muted);font-size:14px}

.rail-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:6px}
.rail-foot button{flex:1;height:34px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2)}
.rail-foot button:hover{background:var(--paper)}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--white)}
.top .back{display:none}
.saved{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.saved i{width:7px;height:7px;border-radius:2px;background:var(--c-desc)}
.saved.err{color:var(--danger)}
.saved.err i{background:var(--danger)}
.top .sp{flex:1}
.ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.ico:hover{background:var(--paper);color:var(--ink)}
.ico.danger:hover{background:var(--c-text-bg);color:var(--danger)}
.btn-line{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);font-weight:500;font-size:13.5px;background:var(--white)}
.btn-line:hover{border-color:#c8ccd4}

.scroll{flex:1;overflow-y:auto;min-height:0;padding:28px 28px 90px}
.stack{max-width:860px;margin:0 auto}

/* ---------- Block ---------- */
.block{display:grid;grid-template-columns:168px minmax(0,1fr);background:var(--white);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.block:focus-within{border-color:#c3c8d2}
.gut{padding:16px 10px 14px 16px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px;min-width:0}
.kind{display:flex;align-items:center;gap:9px;min-width:0}
.sticker{width:14px;height:14px;border-radius:4px;flex:none}
.kind input{width:100%;font-weight:600;font-size:13.5px;letter-spacing:-.005em;min-width:0;text-overflow:ellipsis}
.tools{display:flex;gap:2px;margin-top:auto;opacity:0;transition:opacity .12s;margin-left:-6px}
.block:hover .tools,.block:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:1}}
.tools .ico{width:28px;height:28px}
.tools .ico svg{width:15px;height:15px}
.body{padding:16px 20px 16px;min-width:0;position:relative}
.count{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--danger);font-weight:600}

.b-title{width:100%;display:block;resize:none;overflow:hidden;font-size:26px;line-height:1.22;font-weight:700;letter-spacing:-.025em;padding-bottom:16px}
.b-desc,.b-text{width:100%;display:block;resize:none;overflow:hidden;font-size:15.5px;line-height:1.65;min-height:150px;color:var(--ink-2)}
.b-text{min-height:90px}
.b-title::placeholder,.b-desc::placeholder,.b-text::placeholder,.tag-in::placeholder{color:#aab0bb}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:22px}
.tag{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 4px 0 11px;border-radius:7px;background:var(--c-tags-bg);color:#8a4f00;font-size:13.5px;font-weight:500;max-width:100%}
.tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag button{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;opacity:.55;flex:none}
.tag button:hover{opacity:1;background:rgba(0,0,0,.08)}
.tag svg{width:10px;height:10px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.tag-in{flex:1;min-width:200px;height:28px;font-size:14px}
.hint{font-size:12.5px;color:var(--muted);margin:-8px 0 0}

/* ---------- Add blocks ---------- */
.adder{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:6px 0 0}
.adder>span{font-size:13.5px;color:var(--muted);margin-right:4px}
.add{height:36px;padding:0 14px 0 11px;border-radius:9px;border:1px dashed #c3c8d2;display:inline-flex;align-items:center;gap:9px;font-weight:500;font-size:13.5px;background:transparent}
.add:hover{background:var(--white);border-style:solid;border-color:#c3c8d2}
.add .sticker{width:12px;height:12px;border-radius:3px}

/* ---------- Empty ---------- */
.empty{min-height:60vh;display:grid;place-items:center;text-align:center;padding:30px}
.empty h2{margin:0 0 6px;font-size:28px;letter-spacing:-.03em}
.empty p{margin:0 0 18px;color:var(--muted)}
.empty .btn-new{width:auto;padding:0 22px;display:inline-flex}

/* ---------- Overlay / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(21,23,28,.35);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:var(--white);border-radius:14px;padding:24px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
.modal p{margin:0 0 22px;color:var(--muted)}
.modal .btns{display:flex;justify-content:flex-end;gap:8px}
.modal .btns button{height:40px;padding:0 18px;border-radius:9px;font-weight:600}
.b-cancel{background:var(--paper)}
.b-danger{background:var(--danger);color:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;font-size:14px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast button{font-weight:600;color:#9db4ff;padding:4px 8px;border-radius:6px}
.toast button:hover{background:rgba(255,255,255,.1)}

/* ---------- Extras ---------- */
.logo .ico{margin-left:0}
.tb{display:flex;gap:6px;margin-top:10px}.tb .find{flex:1;margin-top:0}
.row{cursor:pointer}.row .t,.row .m{padding-right:26px}
.rdel{position:absolute;right:10px;top:50%;transform:translateY(-50%);opacity:0;width:28px!important;height:28px!important}
.row:hover .rdel,.row:focus-within .rdel{opacity:1}
@media (hover:none){.rdel{opacity:.6}}
.row.sm{padding-left:46px}
.chk{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:16px;height:16px;accent-color:var(--ink)}
.selbar{display:flex;gap:6px;padding:8px 14px;border-top:1px solid var(--line-2)}
.sbtn{height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);font-weight:500;font-size:13.5px;background:var(--white)}
.sbtn:hover{border-color:#c8ccd4}.sbtn.dng{color:var(--danger);border-color:#f0c6c3}
.sbtn[disabled]{opacity:.4;pointer-events:none}
.selbar .sbtn{flex:1;padding:0 6px;height:34px;font-size:13px}
.stamp{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.modal.wide{max-width:460px;max-height:90vh;overflow:auto}
.set h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 6px;font-weight:600}
.opt{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}.opt input{width:16px;height:16px;accent-color:var(--ink)}
.btns-l{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:820px){.stamp{display:none}}
.btn-new.alt{background:var(--white);color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn-new.alt:hover{background:var(--paper)}
.block.plain{grid-template-columns:1fr}.block.plain .b-text{min-height:50vh;font-size:16px}
/* ---------- Mobile ---------- */
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail,.main{grid-column:1;grid-row:1}
  body:not(.editing) .main{display:none}
  body.editing .rail{display:none}
  .top{padding:0 12px}
  .top .back{display:grid}
  .scroll{padding:16px 14px 90px}
  .block{grid-template-columns:1fr}
  .gut{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line-2);padding:8px 8px 8px 14px}
  .tools{margin:0 0 0 auto;opacity:1}
  .b-title{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Pixel style ---------- */
:root{--line:#15171c;--line-2:#d9dbe0;--paper:#f1f1ee;--font:"Monocraft",ui-monospace,Consolas,monospace}
*{border-radius:0!important;letter-spacing:0!important}
body{font-size:17px;font-feature-settings:normal;-webkit-font-smoothing:none}
input:focus-visible,textarea:focus-visible{outline:none}
:focus-visible{outline:2px dashed var(--focus);outline-offset:2px}
.block{border:2px solid var(--ink)}.block:focus-within{border-color:var(--focus)}
.rail{border-right:2px solid var(--ink)}.top{border-bottom:2px solid var(--ink)}
.find{background:var(--white);border:2px solid var(--ink)}.find:focus-within{border-color:var(--focus)}
.btn-new{border:2px solid var(--ink);box-shadow:3px 3px 0 #9aa0ab}
.btn-new:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #9aa0ab}
.btn-new.alt{box-shadow:3px 3px 0 #d0d3d9}
.sbtn,.btn-line{border:2px solid var(--ink)}.sbtn.dng{border-color:var(--danger)}
.tag{border:2px solid #e3b25c}
.modal{border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.toast{border:2px solid var(--white)}
.gut{border-right:2px solid var(--ink)}
.row.on{border-left-width:4px}
.b-title{font-size:28px;line-height:1.2;padding-bottom:26px}
.b-desc,.b-text{font-size:17px;line-height:1.6}
.count{bottom:8px}
@media (max-width:820px){.b-title{font-size:22px}.gut{border-right:0;border-bottom:2px solid var(--ink)}}

/* ---------- Theme: dusk indigo (замість чорного) ---------- */
:root{
  --ink:#251f63; --ink-2:#3e3a86; --muted:#5f5c9a;
  --paper:#ebe9f8; --white:#fdfcff; --line:#251f63; --line-2:#d3d0ee;
  --brand:#4a3fd6; --brand-2:#3a30b8; --focus:#e8590c;
  --shadow:#a9a3e6;--fs:18px;--fb:18px;--ft:27px;
}
body{background:var(--paper)}
.rail{background:#f6f5fd}
.top{background:#f6f5fd}
.btn-new{background:var(--brand);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn-new:hover{background:var(--brand-2)}
.btn-new:active{box-shadow:1px 1px 0 var(--ink)}
.btn-new.alt{background:var(--white);color:var(--ink);box-shadow:3px 3px 0 var(--shadow)}
.btn-new.alt:hover{background:#e4e1f8}
.row:hover{background:#efedfb}
.row.on{background:var(--paper);border-left-color:var(--brand)}
.block:focus-within{border-color:var(--brand)}
.find:focus-within{border-color:var(--brand)}
.find{background:var(--white)}
.add{border-color:var(--ink-2)}.add:hover{border-color:var(--ink);background:var(--white)}
.btn-line:hover,.sbtn:hover{border-color:var(--brand)}
.b-title::placeholder,.b-desc::placeholder,.b-text::placeholder,.tag-in::placeholder{color:#9a97c8}
.ico:hover{background:#e4e1f8}
.b-cancel{background:#e4e1f8}
.overlay{background:rgba(37,31,99,.45)}
.toast button{color:#c9c4ff}
.chk,.opt input{accent-color:var(--brand)}
.tag{background:#ffe9bf;border-color:#e0a63a}

/* ---------- Чіткий піксельний текст (Monocraft, сітка 9 пікселів) ----------
   Розміри рахує JS так, щоб 1 піксель шрифту = ціле число фізичних пікселів екрана. */
button,input,textarea{font-size:var(--fb)}
body{font-size:var(--fb);font-weight:400;line-height:1.45;text-rendering:optimizeSpeed;font-kerning:none;font-synthesis:none;-webkit-font-smoothing:none;-moz-osx-font-smoothing:auto}
b,strong,h1,h2,h3,button,input,textarea,.row .t,.kind input,.b-title,.btn-new,.tag,.add,.sbtn,.btn-line{font-weight:400!important}
.logo b{font-size:var(--fb)}
.btn-new,.sbtn,.btn-line,.add,.tag,.tag-in,.selbar .sbtn{font-size:var(--fs)}
.btn-new{font-size:var(--fb);height:46px}
.sbtn,.selbar .sbtn{font-size:var(--fs)}
.tag{font-size:var(--fs);height:30px}
.tag-in{font-size:var(--fs)}
.find input{font-size:var(--fs)}
.find{height:44px}
.row .t{font-size:var(--fb)}
.row .m,.stamp,.saved,.count,.hint,.adder>span{font-size:var(--fs)}
.row .m{margin-top:3px}
.kind input{font-size:var(--fs)}
.b-title{font-size:var(--ft);line-height:1.25}
.b-desc,.b-text,.block.plain .b-text{font-size:var(--fb);line-height:1.5}
.empty h2{font-size:var(--ft)}
.empty p{font-size:var(--fb)}
.modal h2{font-size:var(--fb)}
.modal p{font-size:var(--fs)}
.set h3{font-size:var(--fs);text-transform:none}
.opt span{font-size:var(--fs)}
.toast{font-size:var(--fs)}
.none-yet{font-size:var(--fs)}
.rail-foot button{font-size:var(--fs)}
@media (max-width:820px){.b-title{font-size:var(--fb)}body{font-size:var(--fb)}.b-desc,.b-text{font-size:var(--fb)}}

/* ---------- Режим перегляду ---------- */
.rail .logo .ico + .ico{margin-left:0}
.ico.on{background:var(--brand);color:#fff}
.ico.on:hover{background:var(--brand-2);color:#fff}
.view-btn{width:auto;padding:0 12px;gap:8px;display:inline-flex;align-items:center;border:2px solid var(--ink);background:var(--white);color:var(--ink);height:34px;font-size:var(--fs)}
.view-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view-btn:hover{background:#e4e1f8;color:var(--ink)}
.view-btn.on{background:var(--brand);color:#fff}
.view-btn.on:hover{background:var(--brand-2);color:#fff}
.vblock{background:var(--white);border:2px solid var(--ink);margin-bottom:14px;padding:16px 20px 18px}
.vlabel{display:flex;align-items:center;gap:9px;font-size:var(--fs);color:var(--muted);margin-bottom:10px}
.vlabel .sticker{width:12px;height:12px}
.vlabel .ico{margin-left:auto;width:28px;height:28px}
.vlabel .ico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vtitle{font-size:var(--ft);line-height:1.25;margin:0;word-break:break-word;color:var(--ink)}
.vtext{font-size:var(--fb);line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--ink-2);margin:0;user-select:text}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips .tag{padding:0 11px}
body.viewing .adder,body.viewing #delnote{display:none!important}
.saved{margin-right:14px;flex:none;white-space:nowrap}

/* ---------- Виправлення: панель вибору, компактні блоки, чіткий текст ---------- */
:root{--lb:27px;--lt:34px}
body{line-height:var(--lb)}
.b-title,.vtitle,.empty h2{line-height:var(--lt)}
.b-desc,.b-text,.block.plain .b-text,.vtext{line-height:var(--lb)}

/* панель вибору: кнопки не вилазять за рамки */
.selbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}
.selbar .sbtn{height:auto;min-height:38px;padding:4px 8px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.selbar .sbtn.dng{grid-column:1/-1;order:3}
.sbtn.dng:not([disabled]){background:var(--danger);color:#fff;border-color:var(--ink)}
.sbtn.dng:not([disabled]):hover{background:#b8322b}
.sbtn[disabled]{opacity:.45;pointer-events:none}
.sbtn{max-width:100%}

/* компактніші блоки */
.body{padding:12px 16px}
.b-desc,.b-text{min-height:calc(var(--lb)*2)}
.b-title{padding-bottom:26px}
.count{line-height:1;bottom:8px}
.chips{padding-bottom:22px}
@media (min-width:821px){
  .gut{padding:12px 10px 10px 14px;gap:6px}
  .tools{margin-top:0}
  .tools .ico{width:26px;height:26px}
}

/* тост по центру без transform (transform розмиває піксельний текст) */
.toast{left:0;right:0;margin:0 auto;transform:none;width:max-content}

/* ---------- v6: закріплені блоки-кнопки, важливі, очищення тегів ---------- */
.scroll{padding-top:0!important}
.stack{padding-top:28px}
.stack.hasadder{padding-top:0}
.adder{position:sticky;top:0;z-index:6;background:var(--paper);padding:16px 0 12px;margin:0 0 14px;border-bottom:2px solid var(--ink)}
@media (max-width:820px){.stack{padding-top:16px}.adder{flex-wrap:nowrap;overflow-x:auto;padding:10px 0}.adder>span{display:none}.add{flex:none}}
.tclear{position:absolute;left:16px;bottom:6px;font-size:var(--fs);line-height:1;color:var(--muted);padding:3px 5px}
.tclear:hover{color:var(--danger)}
.tag.sel{background:var(--brand);color:#fff;border-color:var(--ink)}
.tabs{display:flex;border-top:2px solid var(--ink)}

<script>
(function(){

    TYPES[t.id]={name:name,color:color,custom:true};out.push({id:t.id,name:name,color:color})});return out}

  var ICON={
    restore:'M3 12a9 9 0 1 0 3-6.7L3 8|M3 3v5h5', star:'M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z', up:'m6 15 6-6 6 6', down:'m6 9 6 6 6-6',

  function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function autosize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}


  /* ---------- Форматований текст: безпечний HTML ---------- */
  var RT_OK={B:1,STRONG:1,I:1,EM:1,U:1,S:1,UL:1,OL:1,LI:1,BR:1,DIV:1,P:1,SPAN:1,FONT:1};
  var RT_SKIP={SCRIPT:1,STYLE:1,TEMPLATE:1,IFRAME:1,OBJECT:1};
  var RT_COLOR=/^(#[0-9a-f]{3,8}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*[\d.]+\s*)?\))$/i;

  }
  // HTML -> простий текст (для пошуку, копіювання, короткого опису)
  function htmlToText(html){
    var doc=new DOMParser().parseFromString('<body>'+String(html||'')+'</body>','text/html');
    var lines=[],cur='';
    function flush(){lines.push(cur);cur=''}
    function walk(n,pref){
      for(var c=n.firstChild;c;c=c.nextSibling){

  }

  /* ---------- Model ---------- */
  function newBlock(type){

  }
  function newNote(kind){

    return {id:uid(),kind:plain?'plain':'block',createdAt:t,updatedAt:t,blocks:(plain?['title','text']:allTypes().filter(function(t){return settings.defaults.indexOf(t)>=0})).map(function(t){return newBlock(t)})};

  function noteTitle(n){
    for(var i=0;i<n.blocks.length;i++)if(n.blocks[i].type==='title'&&n.blocks[i].value.trim())return n.blocks[i].value.trim();
    return '';
  }
  function noteSub(n){
    var tags=0,desc='';
    n.blocks.forEach(function(b){
      if(b.type==='tags')tags+=b.value.length;

    });
    var parts=[];
    if(tags)parts.push(tags+' '+plural(tags,'тег','теги','тегів'));

    return parts.join(' · ')||'Порожня нотатка';

  function plural(n,a,b,c){

  }

  /* ---------- Синхронізація між пристроями (приватний GitHub Gist) ---------- */
  var Sync=(function(){
    var CK='notatnyk:sync:v1', FILE='notatnyk-sync.json', DESC='Notatnyk sync (не видаляйте)';
    var cfg={token:'',gistId:''}, busy=false, again=false, timer=null, poll=null, status='', bad=false, lastOk=0, onStatus=null;
    try{var c=JSON.parse(localStorage.getItem(CK));if(c&&c.token)cfg={token:String(c.token),gistId:String(c.gistId||'')}}catch(e){}
    function saveCfg(){try{localStorage.setItem(CK,JSON.stringify(cfg))}catch(e){}}
    function on(){return !!cfg.token}
    function setStatus(t,err){status=t;bad=!!err;if(onStatus)onStatus()}
    function api(path,opt){
      opt=opt||{};
      return fetch('https://api.github.com'+path,{method:opt.method||'GET',cache:'no-store',
        headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
        body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){
          if(r.status===401)throw new Error('Токен недійсний або без права «gist»');
          if(r.status===404)throw new Error('404');
          if(!r.ok)throw new Error('Помилка GitHub: '+r.status);
          return r.json()});
    }
    function payload(){return JSON.stringify({app:'notatnyk',version:2,types:state.types,notes:state.notes,trash:state.trash,gone:state.gone})}
    function findGist(){
      return api('/gists?per_page=100').then(function(list){
        for(var i=0;i<list.length;i++)if(list[i].files&&list[i].files[FILE])return list[i].id;
        return null});
    }
    function ensureGist(){
      if(cfg.gistId)return Promise.resolve(cfg.gistId);
      return findGist().then(function(id){
        if(id){cfg.gistId=id;saveCfg();return id}
        var files={};files[FILE]={content:payload()};
        return api('/gists',{method:'POST',body:{description:DESC,public:false,files:files}}).then(function(g){cfg.gistId=g.id;saveCfg();return g.id});
      });
    }
    function readRemote(id){
      return api('/gists/'+id).then(function(g){
        var f=g.files&&g.files[FILE];if(!f)return null;
        if(f.truncated&&f.raw_url)return fetch(f.raw_url,{cache:'no-store'}).then(function(r){return r.text()});

    }
    function stamp(n){return Math.max(n.updatedAt||0,n.deletedAt||0)}
    // Повертає true, якщо локальні дані змінилися
    function merge(remote){
      var before=JSON.stringify([state.notes,state.trash,state.types]);
      var gone=state.gone;Object.keys(remote.gone).forEach(function(k){if(!gone[k]||remote.gone[k]>gone[k])gone[k]=remote.gone[k]});
      var map={};
      function put(n,inTrash){
        var cur=map[n.id];
        if(!cur||stamp(n)>stamp(cur.n))map[n.id]={n:n,trash:inTrash};
      }
      state.notes.forEach(function(n){put(n,false)});state.trash.forEach(function(n){put(n,true)});
      remote.notes.forEach(function(n){put(n,false)});remote.trash.forEach(function(n){put(n,true)});

        if(e.trash){if(!n.deletedAt)n.deletedAt=stamp(n);if(n.deletedAt<cut){gone[id]=Date.now();return}trash.push(n)}
        else{delete n.deletedAt;notes.push(n)}

      trash.sort(function(a,b){return (b.deletedAt||0)-(a.deletedAt||0)});
      remote.types.forEach(function(t){if(!state.types.some(function(x){return x.id===t.id}))state.types.push(t)});
      regTypes(state.types);

    function editing(){var a=document.activeElement;return !!(a&&(/^(INPUT|TEXTAREA)$/.test(a.tagName)||a.isContentEditable)&&a.closest&&a.closest('.stack'))}

      if(!navigator.onLine){setStatus('Немає інтернету — синхронізую, коли він з’явиться',true);return Promise.resolve()}
      if(busy){again=true;return Promise.resolve()}
      if(!manual&&editing()){schedule(8000);return Promise.resolve()}
      busy=true;setStatus('Синхронізація…');
      var gid;
      return ensureGist().then(function(id){gid=id;return readRemote(id)}).then(function(txt){
        var changed=false,remoteSame=false;
        if(txt){

            inMerge=true;
            try{changed=merge(rd)}finally{inMerge=false}
            remoteSame=JSON.stringify([rd.notes,rd.trash])===JSON.stringify([state.notes,state.trash])&&JSON.stringify(rd.gone)===JSON.stringify(state.gone);
          }
        }
        if(changed){
          inMerge=true;try{flush()}finally{inMerge=false}

        lastOk=Date.now();setStatus('Синхронізовано о '+new Date(lastOk).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}));
        if(manual)toast('Синхронізовано');
      }).catch(function(e){
        if(e&&e.message==='404'){cfg.gistId='';saveCfg();setStatus('Файл синхронізації не знайдено — спробуйте ще раз',true)}

      disconnect:function(){cfg={token:'',gistId:''};try{localStorage.removeItem(CK)}catch(e){}clearTimeout(timer);setStatus('')},

  /* ---------- Кошик ---------- */

  function buildTitle(b,body){

    ta.addEventListener('input',function(){
      var v=ta.value.replace(/\n/g,' ');

      b.value=v;autosize(ta);upd();queueSave();refreshRow();
    });

  var PALETTE=[['#e5484d','Червоний'],['#f08a00','Помаранчевий'],['#e5b800','Жовтий'],['#2fa66a','Зелений'],['#0aa5b8','Бірюзовий'],['#3b82f6','Синій'],['#a855f7','Фіолетовий'],['#e0409a','Рожевий']];
  function buildText(b,body){
    var ed=h('div',{class:(b.type==='description'?'b-desc':'b-text')+' rte',contenteditable:'true',role:'textbox','aria-multiline':'true','aria-label':TYPES[b.type].name,'data-ph':TYPES[b.type].name,spellcheck:'true'});
    ed.innerHTML=typeof b.html==='string'?sanitizeHTML(b.html):plainToHTML(b.value);
    var saved=null;
    function inEd(n){return n&&(n===ed||ed.contains(n))}
    function saveSel(){var sl=window.getSelection();if(sl.rangeCount&&inEd(sl.anchorNode))saved=sl.getRangeAt(0).cloneRange()}
    function restoreSel(){
      ed.focus();
      if(saved){var sl=window.getSelection();sl.removeAllRanges();sl.addRange(saved)}
    }
    function onSel(){if(!ed.isConnected){document.removeEventListener('selectionchange',onSel);return}if(document.activeElement===ed)saveSel()}
    document.addEventListener('selectionchange',onSel);
    function commit(){
      var clean=sanitizeHTML(ed.innerHTML);
      var txt=htmlToText(clean);
      if(!txt&&!ed.querySelector('li')&&ed.innerHTML!==''&&ed.textContent==='')ed.innerHTML='';
      b.html=txt||ed.querySelector('li')?clean:'';
      b.value=txt;
      queueSave();refreshRow();
    }
    ed.addEventListener('input',commit);
    ed.addEventListener('paste',function(e){
      e.preventDefault();
      var t=(e.clipboardData||window.clipboardData).getData('text/plain');
      document.execCommand('insertText',false,t);
    });
    // Markdown-подібні скорочення: «- », «* », «1. » на початку рядка → список (як у Word)
    ed.addEventListener('keydown',function(e){
      if(e.key!==' '||e.ctrlKey||e.metaKey||e.altKey)return;
      var sl=window.getSelection();if(!sl.rangeCount||!sl.isCollapsed)return;
      var nd=sl.anchorNode;if(!nd||nd.nodeType!==3||nd.previousSibling)return;
      var par=nd.parentNode;if(par!==ed&&!(par.parentNode===ed&&/^(DIV|P)$/.test(par.tagName)))return;
      var pre=nd.nodeValue.slice(0,sl.anchorOffset);
      var ol=/^\d+\.$/.test(pre),ul=/^[-*•]$/.test(pre);
      if(!ol&&!ul)return;
      e.preventDefault();
      var rest=nd.nodeValue.slice(pre.length);
      if(rest){nd.nodeValue=rest;var r=document.createRange();r.setStart(nd,0);r.collapse(true);sl.removeAllRanges();sl.addRange(r)}
      else{
        var br=document.createElement('br');par.replaceChild(br,nd);
        var r2=document.createRange();r2.setStartBefore(br);r2.collapse(true);sl.removeAllRanges();sl.addRange(r2);
      }
      document.execCommand(ol?'insertOrderedList':'insertUnorderedList');
      commit();
    });
    ed.addEventListener('keydown',function(e){
      if(e.key==='Escape'){ed.blur()}
    });

    function tbtn(label,title,fn,cls){
      var x=h('button',{type:'button',class:'rtbtn'+(cls?' '+cls:''),title:title,'aria-label':title,text:label});
      x.addEventListener('mousedown',function(e){e.preventDefault()});

      return x;
    }
    function ex(cmd,val){try{document.execCommand(cmd,false,val)}catch(e){}}
    var tb=h('div',{class:'rtb',role:'toolbar','aria-label':'Форматування'});
    tb.appendChild(tbtn('Ж','Жирний (Ctrl+B)',function(){ex('styleWithCSS',false);ex('bold')},'rtb-b'));
    tb.appendChild(tbtn('• Список','Маркований список: виділіть рядки або поставте курсор',function(){ex('insertUnorderedList')}));
    tb.appendChild(tbtn('1. Список','Нумерований список: виділіть рядки або поставте курсор',function(){ex('insertOrderedList')}));
    var sw=h('span',{class:'rtsws'});
    PALETTE.forEach(function(c){
      var x=h('button',{type:'button',class:'rtsw',title:'Колір: '+c[1],'aria-label':'Колір: '+c[1],style:'background:'+c[0]});
      x.addEventListener('mousedown',function(e){e.preventDefault()});
      x.addEventListener('click',function(){restoreSel();ex('styleWithCSS',true);ex('foreColor',c[0]);saveSel();commit()});
      sw.appendChild(x);
    });
    var cp=h('input',{type:'color',class:'rtcp',title:'Свій колір','aria-label':'Свій колір',value:'#e5484d'});
    cp.addEventListener('input',function(){restoreSel();ex('styleWithCSS',true);ex('foreColor',cp.value);saveSel();commit()});
    sw.appendChild(cp);
    tb.appendChild(sw);
    tb.appendChild(tbtn('Аа','Скинути форматування виділеного',function(){ex('removeFormat')},'rtb-x'));
    body.appendChild(ed);body.appendChild(tb);
  }
  function buildTags(b,body){
    var chips=h('div',{class:'chips'});

    var count=h('div',{class:'count'});

    var clr=h('button',{class:'tclear',text:'Очистити все',title:'Видалити всі теги (Ctrl+A, потім Delete)',onclick:function(){clearAll();input.focus()}});
    function setSel(on){allSel=on;chips.querySelectorAll('.tag').forEach(function(el){el.classList.toggle('sel',on)})}
    function draw(){
      chips.textContent='';
      if(!b.value.length)allSel=false;
      b.value.forEach(function(t,idx){
        var x=h('button',{'aria-label':'Прибрати тег '+t,onclick:function(){b.value.splice(idx,1);queueSave();draw();refreshRow();input.focus()}});
        x.appendChild(icon(ICON.x));
        chips.appendChild(h('span',{class:'tag'+(allSel?' sel':'')},[h('span',{text:t}),x]));
      });

      clr.classList.toggle('hidden',!b.value.length);
    }
    function clearAll(){
      if(!b.value.length)return;
      var old=b.value.slice();
      b.value=[];allSel=false;
      queueSave();draw();refreshRow();
      toast('Видалено тегів: '+old.length,'Повернути',function(){b.value=old;queueSave();draw();refreshRow()});
    }
    function addMany(raw){
      var parts=raw.split(/[,;\n\r]+/).map(function(s){return s.replace(/^#+/,'').replace(/\s+/g,' ').trim()}).filter(Boolean);
      var have={};b.value.forEach(function(t){have[t.toLowerCase()]=1});
      var added=0;
      parts.forEach(function(p){if(!have[p.toLowerCase()]){have[p.toLowerCase()]=1;b.value.push(p);added++}});
      if(added){queueSave();refreshRow()}
      draw();
      return added;
    }
    input.addEventListener('paste',function(e){
      var txt=(e.clipboardData||window.clipboardData).getData('text');
      if(txt&&/[,;\n]/.test(txt)){
        e.preventDefault();
        var k=addMany(txt);
        toast(k?'Додано '+k+' '+plural(k,'тег','теги','тегів'):'Ці теги вже є');
        input.focus();
      }
    });
    input.addEventListener('keydown',function(e){
      var mod=e.ctrlKey||e.metaKey,k=e.key;
      function is(l,code){return k===l||k===l.toUpperCase()||e.code===code}
      if(mod&&is('a','KeyA')&&!input.value&&b.value.length){e.preventDefault();setSel(true);return}
      if(allSel){
        if(k==='Backspace'||k==='Delete'){e.preventDefault();clearAll();return}
        if(mod&&is('c','KeyC')){e.preventDefault();copyText(b.value.join(', '),'Теги скопійовано');return}
        if(mod&&is('x','KeyX')){e.preventDefault();copyText(b.value.join(', '),'Теги скопійовано');clearAll();return}
        if(k==='Shift'||k==='Control'||k==='Meta'||k==='Alt'||k==='CapsLock')return;
        setSel(false);
      }
      if(k==='Enter'||k===','){
        e.preventDefault();
        if(input.value.trim()){addMany(input.value);input.value='';input.focus()}
      }else if(k==='Backspace'&&!input.value&&b.value.length){
        b.value.pop();queueSave();draw();refreshRow();input.focus();
      }
    });
    input.addEventListener('blur',function(){
      setSel(false);
      if(input.value.trim()){addMany(input.value);input.value=''}
    });
    body.appendChild(chips);body.appendChild(count);body.appendChild(clr);draw();
  }

  function renderAll(){renderList();renderStack()}

  /* ---------- Backup ---------- */
  function exportData(){
    flush();
    var blob=new Blob([JSON.stringify({app:'notatnyk',version:2,rev:state.rev,types:state.types,notes:state.notes,trash:state.trash,gone:state.gone},null,2)],{type:'application/json'});
    var a=document.createElement('a');
    var d=new Date();
    a.href=URL.createObjectURL(blob);
    a.download='notatnyk-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
    toast('Копію збережено у файл');
  }
  function importData(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=normalize(JSON.parse(r.result));
        if(!data)throw new Error('bad');
        data.types.forEach(function(t){if(!state.types.some(function(x){return x.id===t.id}))state.types.push(t)});
        regTypes(state.types);
        var byId={};state.notes.forEach(function(n){byId[n.id]=n});
        var added=0,updated=0;
        data.trash.forEach(function(n){if(!byId[n.id]&&!state.trash.some(function(t){return t.id===n.id}))state.trash.push(n)});
        data.notes.forEach(function(n){
          var cur=byId[n.id];
          if(!cur){state.notes.push(n);added++}
          else if(n.updatedAt>cur.updatedAt){state.notes[state.notes.indexOf(cur)]=n;updated++}
        });
        state.rev=Date.now();flush();
        if(!active()&&state.notes[0])activeId=state.notes[0].id;
        renderAll();
        toast('Відновлено: нових '+added+', оновлено '+updated);
      }catch(e){toast('Це не схоже на файл копії Нотатника')}
    };
    r.readAsText(file);
  }


  function syncView(){
    var v=settings.view;
    document.body.classList.toggle('viewing',v);
    var a=$('viewmode');a.classList.toggle('on',v);
    a.title=v?'Вийти з перегляду':'Режим перегляду';a.setAttribute('aria-pressed',v?'true':'false');
    var t=$('viewtop');t.textContent='';t.classList.toggle('on',v);
    t.appendChild(icon(v?ICON.pen:ICON.eye));t.appendChild(document.createTextNode(v?'Редагувати':'Перегляд'));
    t.title=v?'Перейти до редагування':'Перейти до перегляду';
  }
  function setView(v){
    settings.view=v;saveSettings();syncView();
    if(v&&document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    if(v)flush();
    renderStack();
  }


  function fitPixels(){
    var d=window.devicePixelRatio||1,r=document.documentElement.style;
    function px(k){return (9*k/d).toFixed(4)+'px'}
    r.setProperty('--fs',px(Math.max(2,Math.round(1.4*d))));
    r.setProperty('--fb',px(Math.max(2,Math.round(1.6*d))));
    var kb=Math.max(2,Math.round(1.6*d)),kt=Math.max(3,Math.round(2.4*d));
    function dp(n){return (n/d).toFixed(4)+'px'}
    r.setProperty('--ft',px(kt));
    r.setProperty('--lb',dp(Math.round(9*kb*1.5)));
    r.setProperty('--lt',dp(Math.round(9*kt*1.25)));
  }
  fitPixels();window.addEventListener('resize',fitPixels);

  /* ---------- Init ---------- */
  $('kn').textContent=MOD+'+N / Alt+N';$('kf').textContent=MOD+'+F';
  $('keys').title='Ctrl+N може відкривати нове вікно браузера — тоді користуйтеся Alt+N';
  $('new').title='Нова нотатка ('+MOD+'+N або Alt+N)';
  $('q').placeholder='Пошук ('+MOD+'+F)';$('q').title='Пошук ('+MOD+'+F)';
  $('new').addEventListener('click',function(){addNote()});
  $('newplain').addEventListener('click',function(){addNote('plain')});
  $('delnote').addEventListener('click',function(){confirmDeleteNote()});
  $('back').addEventListener('click',function(){document.body.classList.remove('editing')});
  $('q').addEventListener('input',function(e){query=e.target.value;renderList()});
  $('settings').appendChild(icon(ICON.gear));$('viewmode').appendChild(icon(ICON.eye));
  $('viewmode').addEventListener('click',function(){setView(!settings.view)});
  $('viewtop').addEventListener('click',function(){setView(!settings.view)});$('sel').appendChild(icon(ICON.check));
  $('settings').addEventListener('click',openSettings);
  $('pinnote').appendChild(icon(ICON.star));$('pinnote').addEventListener('click',function(){var n=active();if(n)togglePin(n)});
  $('sel').addEventListener('click',function(){selMode=!selMode;sel={};renderList()});
  $('file').addEventListener('change',function(e){var f=e.target.files[0];if(f)importData(f);e.target.value=''});
  document.addEventListener('keydown',function(e){
    var o=topOverlay();
    if(o){
      if(e.key==='Escape'){o.remove();return}
      if(e.key==='Enter'&&o._ok){var a=document.activeElement;if(a&&a.classList.contains('b-cancel'))return;e.preventDefault();o._ok()}
      return;
    }
    var mod=e.ctrlKey||e.metaKey;
    if(mod&&!e.shiftKey&&!e.altKey&&(e.code==='KeyF'||e.key==='f'||e.key==='F')){
      e.preventDefault();document.body.classList.remove('editing');
      var qi=$('q');qi.focus();qi.select();return;
    }
    if(!e.shiftKey&&(e.code==='KeyN'||e.key==='n'||e.key==='N')&&((mod&&!e.altKey)||(e.altKey&&!mod))){
      e.preventDefault();addNote();return;
    }
    if(e.key==='Delete'&&!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&!e.target.isContentEditable){
      if(tab==='trash')return;if(selMode)deleteSelected();else confirmDeleteNote();
    }
  });

  load();loadSettings();applyTheme();syncView();
  if(Sync.on()){Sync.start();setTimeout(function(){Sync.run(false)},400)}
  var first=filtered()[0];
  if(first)activeId=first.id;
  renderAll();
})();
</script>
</body>
</html>
